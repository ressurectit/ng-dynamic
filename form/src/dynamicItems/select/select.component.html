<label>{{options?.label}}</label>
@if (!options?.multiple)
{
    <select [formControl]="control|asFormControl|asRequired">
        @for (value of values; track value)
        {
            <option [value]="value?.code">{{value?.value}}</option>
        }
    </select>
}
@else
{
    <select multiple [formControl]="control|asFormControl|asRequired">
        @for (value of values; track value)
        {
            <option [value]="value?.code">{{value?.value}}</option>
        }
    </select>
}
