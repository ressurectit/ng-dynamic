<mat-tab-group [mat-stretch-tabs]="false">
    @for (tab of options?.tabs; track tab; let i = $index)
    {
        <mat-tab #tabComponent="matTab" [label]="tab.title"  [labelClass]="tabComponent.disabled ? 'hidden': ''" [bodyClass]="tabComponent.disabled ? 'hidden': ''">
            <ng-container *layoutComponentRenderer="tab.content" (layoutComponentRendererComponentChange)="onTabComponentChange($any($event), i)"/>
        </mat-tab>
    }
</mat-tab-group>
