<div class="editor-component-name">{{(data.metadata.singleton ? (data.metadata.displayName || data.itemSource.name) : (data.metadata.metaInfo?.name ?? data.itemSource.name))|firstUppercaseLocalize}}</div>
@if (data.metadata.metaInfo?.description)
{
    <div class="editor-component-description">{{data.metadata.metaInfo?.description|firstUppercaseLocalize}}</div>
}
